services:
  postgres:
    image: postgres:18
    container_name: car_management
    environment:
      POSTGRES_USER: user_postgres
      POSTGRES_PASSWORD: pass_postgres
      POSTGRES_DB: car_management
    ports:
      - '5432:5432'
    volumes:
      - db-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user_postgres']
      interval: 2s
      retries: 15

volumes:
  db-postgres-data:
